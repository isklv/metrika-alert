services:
  metrika-alert:
    image: ghcr.io/isklv/metrika-alert:latest
    # Build locally instead of pulling: docker compose up -d --build
    build: .
    container_name: metrika-alert
    restart: unless-stopped

    environment:
      # --- Telegram ---
      METRIKA_BOT_TOKEN: "${METRIKA_BOT_TOKEN:-}"
      METRIKA_ADMIN_IDS: "${METRIKA_ADMIN_IDS:-}"
      # --- VK Teams ---
      METRIKA_VKTEAMS_TOKEN: "${METRIKA_VKTEAMS_TOKEN:-}"
      METRIKA_VKTEAMS_ADMINS: "${METRIKA_VKTEAMS_ADMINS:-}"
      # On-premise VK Teams: point this at your own host.
      METRIKA_VKTEAMS_BASE: "${METRIKA_VKTEAMS_BASE:-https://myteam.mail.ru/bot/v1}"
      # --- REST API (off by default) ---
      METRIKA_API_ENABLED: "${METRIKA_API_ENABLED:-false}"
      METRIKA_API_TOKEN: "${METRIKA_API_TOKEN:-}"
      METRIKA_REPORT_HOURS: "${METRIKA_REPORT_HOURS:-1}"
      TZ: "${TZ:-Europe/Moscow}"

    volumes:
      - metrika-data:/data

    # Published only on loopback: the API creates counters and reads alert
    # history. Expose it more widely only behind a reverse proxy with TLS.
    ports:
      - "127.0.0.1:8090:8090"

    healthcheck:
      # Only meaningful with METRIKA_API_ENABLED=true; otherwise nothing listens.
      test: ["CMD", "/usr/bin/metrika-alert", "-health", "/etc/metrika-alert/config.yaml"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  metrika-data:
