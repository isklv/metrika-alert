# Database: relative path resolved under ~/.metrika-alert/, or an absolute path.
database: metrika.db

# --- Telegram -----------------------------------------------------------------
telegram:
  # Token from @BotFather. Leave empty to disable the Telegram channel.
  bot_token: ""
  # Users allowed to configure the service. An EMPTY LIST LOCKS THE BOT DOWN:
  # it refuses every command. Message the bot and it replies with the ID to add.
  admin_ids:
    - 123456789
  # Optional SOCKS5/HTTP proxy for the Telegram API.
  # proxy_url: socks5://user:pass@proxy.example.com:1080

# --- VK Teams (ВК Тимс) -------------------------------------------------------
vkteams:
  # Token issued by @Metabot in VK Teams. Leave empty to disable this channel.
  bot_token: ""
  # Cloud endpoint by default. On-premise installations point this at their own
  # host, e.g. https://myteam.corp.example/bot/v1
  base_url: https://myteam.mail.ru/bot/v1
  # VK Teams user IDs (address-like or numeric strings), same lockdown rule as
  # Telegram above. Send /whoami to the bot to learn your ID.
  admin_ids:
    - user@corp.example
  # proxy_url: http://proxy.corp.example:3128

# --- Yandex.Metrika -----------------------------------------------------------
# OAuth tokens are stored per counter in the database, not here.
metrika:
  # The Reporting API host. Note the .net domain — api-metrika.yandex.ru does
  # not serve the API.
  base_url: https://api-metrika.yandex.net

  # How long data is left to settle before it is judged. Metrika keeps counting
  # sessions for a short while after they happen, so measuring right up to the
  # present reads low and would fire false drops.
  settle_minutes: 20

  # Width of one measurement window, and how often it advances.
  #
  # The window is an hour wide but moves every ten minutes: a drop is noticed
  # within minutes, while the figure compared stays at hourly scale. Do not
  # shrink the window to the step — a bare ten-minute bucket holds a sixth of
  # the traffic and swings far too much week to week for a percentage threshold
  # to mean anything.
  #
  # step_minutes is also the granularity requested from the API, and it is one
  # request per step per counter: 10 minutes means 144 requests a day.
  window_minutes: 60
  step_minutes: 10

  # How many missed windows one check works through. After downtime the service
  # catches up gradually instead of firing a burst of stale alerts at once.
  max_catch_up_steps: 6

# --- REST API (optional) ------------------------------------------------------
api:
  enabled: false
  listen_addr: ":8090"
  # Required as "Authorization: Bearer <token>" on every /api/ request. Leave
  # empty ONLY when the listen address is loopback or a trusted private network:
  # the API creates counters and reads alert history.
  auth_token: ""

# Periodic report interval in hours. 0 disables periodic reports.
report_interval_hours: 1
